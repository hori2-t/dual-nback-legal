<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual N-Back: 集中力トレーニング — 法的情報</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #0066cc;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 32px;
  }
  .links {
    display: grid;
    gap: 12px;
    margin: 32px 0;
  }
  .link-card {
    display: block;
    padding: 20px 24px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .link-card h2 {
    font-size: 16px;
    margin: 0 0 4px 0;
    color: var(--accent);
  }
  .link-card p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }
  footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Dual N-Back: 集中力トレーニング</h1>
    <p class="subtitle">毎日5分で思考スピードを上げる</p>

    <div class="links">
      <a class="link-card" href="privacy.html">
        <h2>プライバシーポリシー</h2>
        <p>本アプリが収集するデータと取り扱い方針について</p>
      </a>
      <a class="link-card" href="terms.html">
        <h2>利用規約</h2>
        <p>本アプリの利用条件について</p>
      </a>
    </div>

    <footer>
      © 2026 hori2. All rights reserved.
    </footer>
  </div>
</body>
</html>
